site_name: The Serene Digital Garden
site_url: "https://abokamal09.github.io/"
theme:
  name: material
  custom_dir: theme
  language: ar
  direction: rtl
  logo: assets/logo-dark.ico
  favicon: assets/logo-dark.ico
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.top        # Back-to-top button
    - navigation.tracking   # Updates URL hash as user scrolls
    - header.autohide       # Hides header on scroll down for reading focus
    - search.suggest        # Auto-complete suggestions in search
    - search.highlight      # Highlights search terms within the page
    - toc.follow            # Active section tracking in right sidebar
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Tajawal
    code: Tajawal

plugins:
  - search
  - blog:
      blog_dir: .
      blog_toc: false
  # ── Social Cards ────────────────────────────────────────────────────────────
  # The social plugin requires cairosvg, which depends on the native Cairo C
  # library. On Windows, this requires MSYS2:
  #   pacman -S mingw-w64-x86_64-python-cairosvg
  # On Linux/CI (e.g. GitHub Actions), it is available out of the box.
  # The background image (docs/assets/social-bg.png) is ready for use.
  # Uncomment the block below when deploying on Linux/CI:
  #
  - social:
      cards_layout_options:
        background_color: "#0D1117"
        color: "#C9D1D9"
        font_family: "Tajawal"
  # ────────────────────────────────────────────────────────────────────────────

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/abokamal09
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/ahmedkamaldev
      name: LinkedIn
