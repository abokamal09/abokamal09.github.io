site_name: The Serene Digital Garden
site_url: "https://abokamal09.github.io/"
theme:
  name: material
  custom_dir: theme
  language: ar
  direction: rtl
  logo: assets/logo-light.png
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Tajawal
    code: Tajawal

plugins:
  - search
  - blog:
      blog_dir: .
      blog_toc: false
  # ── Social Cards ────────────────────────────────────────────────────────────
  # The social plugin requires cairosvg, which depends on the native Cairo C
  # library. On Windows, this requires MSYS2:
  #   pacman -S mingw-w64-x86_64-python-cairosvg
  # On Linux/CI (e.g. GitHub Actions), it is available out of the box.
  # The background image (docs/assets/social-bg.png) is ready for use.
  # Uncomment the block below when deploying on Linux/CI:
  #
  - social:
      cards_layout_options:
        background_color: "#F9F5F0"
        color: "#3C2E21"
        font_family: "Tajawal"
  # ────────────────────────────────────────────────────────────────────────────

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/abokamal09
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/ahmedkamaldev
      name: LinkedIn
